name: Serving delivery CPU checks
on: [push, pull_request]
jobs:
  delivery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Small CPU-only event client dependencies
        run: python -m pip install -r config/delivery/cpu_requirements.txt
      - name: Delivery and TP contracts without CUDA or model downloads
        run: python -m unittest discover -s tests/delivery -p 'test_*.py' -v
      - name: Configuration, authored Python and documentation links
        run: python scripts/check_delivery_cpu.py
      - name: Rental deployment, cleanup and result accounting without CUDA
        run: python -m unittest discover -s tests/rental -v
