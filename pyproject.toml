[project]
name = "routescale"
version = "0.1.0"
description = "Transformer training performance experiments based on nanoGPT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.12.1",
    "numpy>=1.26,<3",
    "requests>=2.32,<3",
    "tiktoken>=0.9,<1",
    "datasets>=3,<5",
]

[project.optional-dependencies]
hf = ["transformers>=4,<6"]
logging = ["wandb>=0.19,<1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
